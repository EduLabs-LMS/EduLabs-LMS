# EduLabs overrides for docker-jitsi-meet stable-11248-3 (its own Compose project, never the EduLabs one).
#
# Used ONLY together with the upstream files of the pinned tag, through infra/jitsi/jitsi.sh:
#   docker compose -p edulabs-jitsi --env-file /etc/edulabs/jitsi.env \
#     -f /opt/jitsi/docker-jitsi-meet/docker-compose.yml \
#     -f /opt/jitsi/docker-jitsi-meet/whiteboard.yml \
#     -f /opt/jitsi/edulabs/compose.override.yml ...
#
# "The website always wins" on this shared VPS (4 vCPU, 8 GB; EduLabs app 3 GB / 2.5 CPU, Caddy 256 MB, worker 384 MB):
#   - hard CPU and memory caps on every Jitsi container (memswap = mem, so no swap creep);
#   - half the CPU weight of an EduLabs container (cpu_shares 512 vs the default 1024), so under contention the app is scheduled first;
#   - a raised OOM score, so if the host ever runs out of memory the kernel kills a Jitsi process before the app;
#   - bounded logs (3 x 10 MB per container) and bounded process counts.
# Totals: memory 2.44 GB worst case (every container at its cap; with EduLabs at its caps, 6.0 GB of 8 GB, leaving ~2 GB for
# Debian, Docker, cloudflared and the page cache). CPU caps add up to 4.25, but the JVB alone is capped at 2 of 4 vCPUs and
# the weights above give the app the CPU first.
#
# Ports (stable-11248-3, read from its docker-compose.yml and whiteboard.yml): web ${HTTP_PORT}:8000 and ${HTTPS_PORT}:8443,
# jicofo 127.0.0.1:8888, jvb ${JVB_PORT}:10000/udp and 127.0.0.1:8080; prosody only "expose"s 5222/5269/5347/5280 inside the
# Docker network; whiteboard publishes nothing (it listens on 80 inside the network, metrics on 9090, neither published).
# There is no 4443/tcp in this release. `./jitsi.sh ports` prints the list and `./jitsi.sh check` refuses any public one but 10000/udp.
# The upstream file publishes web on ${HTTP_PORT}/${HTTPS_PORT}; jitsi.env sets them to 127.0.0.1:8000 and
# 127.0.0.1:8443 (loopback only, for the Cloudflare Tunnel). JVB publishes ${JVB_PORT}/udp (10000) on every interface:
# that is the media port and must be public. Jicofo REST (8888) and JVB colibri REST (8080) are already bound to 127.0.0.1
# upstream. coturn uses the host network (TURN needs the real public address) and listens only where turnserver.conf says.

x-edulabs-logging: &edulabs-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    restart: unless-stopped
    logging: *edulabs-logging
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 256
    cpu_shares: 512
    oom_score_adj: 500
    security_opt:
      - no-new-privileges:true

  prosody:
    restart: unless-stopped
    logging: *edulabs-logging
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    cpu_shares: 512
    oom_score_adj: 500
    security_opt:
      - no-new-privileges:true

  jicofo:
    restart: unless-stopped
    logging: *edulabs-logging
    cpus: 0.5
    # Java heap is JICOFO_MAX_MEMORY=320m in jitsi.env; the rest is JVM overhead.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 512
    cpu_shares: 512
    oom_score_adj: 500
    security_opt:
      - no-new-privileges:true

  jvb:
    restart: unless-stopped
    logging: *edulabs-logging
    # Two of the four vCPUs at most. ~15 students with cameras off plus the teacher's screen and voice is far below this.
    cpus: 2.0
    # Java heap is VIDEOBRIDGE_MAX_MEMORY=896m in jitsi.env; the rest is JVM overhead and native buffers.
    mem_limit: 1280m
    memswap_limit: 1280m
    pids_limit: 1024
    cpu_shares: 512
    oom_score_adj: 500
    security_opt:
      - no-new-privileges:true

  whiteboard:
    # Image pinned by the upstream whiteboard.yml of stable-11248-3 (jitsi/excalidraw-backend:2026.3.0). Restated so a
    # different whiteboard.yml can never silently change it.
    image: jitsi/excalidraw-backend:2026.3.0
    restart: unless-stopped
    logging: *edulabs-logging
    cpus: 0.25
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    cpu_shares: 256
    oom_score_adj: 600
    environment:
      # Only the meeting page may open a whiteboard connection from a browser (upstream default is any origin).
      - CORS_ORIGIN=${PUBLIC_URL}
    security_opt:
      - no-new-privileges:true

  coturn:
    # TURN for strict mobile networks: TURN over TLS on public TCP 443, plain TURN/STUN on 3478/udp.
    # No-new-privileges is NOT set here on purpose: the image binds 443 as an unprivileged user through a file
    # capability on /usr/bin/turnserver, which no-new-privileges would block. Every other capability is dropped.
    image: coturn/coturn:4.19.0-debian
    network_mode: host
    restart: unless-stopped
    logging: *edulabs-logging
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - /etc/edulabs/jitsi/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/edulabs/jitsi/turn-certs:/etc/coturn/certs:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/lib/coturn:size=16m
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    cpu_shares: 512
    oom_score_adj: 500

networks:
  # A fixed name for the Jitsi bridge network's host interface (Linux allows 15 characters), so a firewall rule or a log
  # line can name it. Upstream leaves it random (br-<id>).
  meet.jitsi:
    driver_opts:
      com.docker.network.bridge.name: br-jitsi
