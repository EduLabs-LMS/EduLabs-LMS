# EduLabs live classes: nginx settings for the meet host (the Jitsi web container).
# Install: cp to ${CONFIG}/web/nginx-custom/edulabs.conf (runbook step 5). The pinned web image (stable-11248-3) includes
# /run/web/config/nginx-custom/*.conf (a copy of ${CONFIG}/web) inside BOTH of its server blocks (meet.conf), at server level.
# Its nginx.conf is regenerated from the image on every start, so changes belong here, never in the generated files.
# ./jitsi.sh check refuses to start unless this exact file is installed and the pinned meet.conf still includes it.

# No access log. Meeting addresses carry a token (?jwt= in the frame address, token= on /xmpp-websocket) and the image's own
# format hides only those two names; nothing here needs per-request lines (bridge and focus logs show who joined).
access_log off;
# Failed proxied requests (for example /xmpp-websocket while prosody restarts) are written at "error" with the full request
# line, token included: only "crit" and worse are kept for this server.
error_log /dev/stderr crit;

# Every response, every status code, every location (a location with its own add_header drops the server's add_header
# lines; more_set_headers, from the headers-more module that the image's nginx-extras installs, is inherited by all of them).
more_set_headers "Referrer-Policy: no-referrer";
