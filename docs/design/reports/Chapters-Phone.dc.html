<style>
body{margin:0}
.r{box-sizing:border-box;background:#EDF1E8;color:#1D2518;font-family:'Figtree',system-ui,sans-serif;font-size:15px;line-height:22px}
.r *{box-sizing:border-box}
.r button{font-family:inherit;color:inherit}
.pt{font-family:'Caprasimo',serif;font-weight:400;font-size:22px;line-height:28px;margin:0}
.m{font-size:13px;line-height:18px;color:#56684B}
.l{font-weight:600;font-size:15px;line-height:20px}
.d{font-weight:700;font-variant-numeric:tabular-nums}
.c{background:#FBFDF8;border:1px solid #D3DEC9;border-radius:18px;box-shadow:0 3px 0 #D3DEC9}
.ph{height:56px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid #D3DEC9;background:#F6F9F2}
.pick{height:40px;border:1px solid #B7C6AA;border-radius:12px;background:#FFFFFF;padding:0 10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.seg{display:flex;background:#E3E9DC;border-radius:12px;padding:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;font-weight:600;font-size:14px;color:#44523D;cursor:pointer}
.seg button.on{background:#FFFFFF;color:#1D2518;box-shadow:0 1px 2px rgba(29,37,24,.2)}
.ch{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.gl{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;align-items:center;gap:8px;font-size:13px}
.bar{height:8px;border-radius:999px;background:#DCE5D3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:#2B6416}
.bar i.lo{background:#B7791F}
.pl{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{color:#2B6416;background:#E3F3DA}.wa{color:#7A4F00;background:#FEF3C7}
.weak{border-color:#E8C77A;box-shadow:0 3px 0 #E8C77A}
</style>
</helmet>

<div style="flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px">
